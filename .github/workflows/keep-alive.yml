name: Render Backend 24/7 Keep-Alive

on:
  schedule:
    # Trigger every 10 minutes so Render free tier never goes to sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Probe
        run: |
          echo "Pinging CHARIS master backend on Render..."
          curl -s -f -m 60 https://chariss-backend.onrender.com/health || echo "Probe pinged"
